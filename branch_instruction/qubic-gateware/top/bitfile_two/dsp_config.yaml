cores:
  coupler: 16

state_disc: y-axis # y-axis or ml
rc: False
pce: False

dac_samples_per_clk: 16
dac_nbits: 16 #per sample

adc_samples_per_clk: 16
adc_nbits: 16 #per sample

dac_outputs: 
  # these can be generate blocks representing assignments to dac channels
  #   expr: <dac_ind> <= <chan_expr>
  #
  #  range is [) like python slices
  - gen:
      var: i
      range: 0, 16
      expr: i <= coupler.dc[i] + coupler.cdrv[i]


core_defs:
  coupler:
    instr_mem_depth: 8192
    sig_gens:
      cdrv:
        type: rf
        interp_ratio: 1
        env_mem_depth: 8192 # x32 bit
        freq_mem_depth: 8192
        delay: 2
      dc:
        type: dc_offset
        delay: 2

